<div class="prose-style-selector-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>✍️ Prose Style Selector</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <div class="prose-toggle-row">
                <input id="prose_enabled" type="checkbox" />
                <label for="prose_enabled"><b>Enable Prose Enhancement</b></label>
            </div>

            <div class="prose-row">
                <label for="prose_genre">Genre Style:</label>
                <select id="prose_genre" class="text_pole">
                    <option value="none">— Universal Only —</option>
                    <optgroup label="Core Genres">
                        <option value="scifi">🚀 Sci-Fi</option>
                        <option value="fantasy">🧝 Fantasy</option>
                        <option value="romance">💕 Romance</option>
                        <option value="romcom">😂💕 Rom-Com</option>
                        <option value="comedy">😂 Comedy</option>
                    </optgroup>
                    <optgroup label="Dark Genres">
                        <option value="horror">🩸 Horror</option>
                        <option value="fantastic_horror">🌑 Fantastic Horror</option>
                        <option value="thriller">🔪 Thriller</option>
                        <option value="psychological_thriller">🧠 Psychological Thriller</option>
                        <option value="mystery">🔍 Mystery</option>
                    </optgroup>
                    <optgroup label="Other">
                        <option value="action">💥 Action</option>
                        <option value="slice_of_life">☕ Slice of Life</option>
                        <option value="erotica">🌹 Erotica</option>
                        <option value="horror_erotica">🕯️ Horror Erotica</option>
                    </optgroup>
                </select>
            </div>

            <div class="prose-hint" id="prose_hint">
                Select a genre for additional style tips.
            </div>

        </div>
    </div>
</div>
